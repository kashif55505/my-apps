name: Facebook Uploader – build and release

# Every change under facebook-uploader/ builds a Windows .exe and publishes it
# as a GitHub Release tagged fbu-v1.<n>. The app's in-app "Check for updates"
# button reads the newest fbu-v* release and swaps the exe in place.
on:
  push:
    branches: [main]
    paths:
      - 'facebook-uploader/**'
      - '.github/workflows/facebook-uploader.yml'
      - '!facebook-uploader/**.md'
      - '!facebook-uploader/**.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: facebook-uploader-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: facebook-uploader
    env:
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Version
        shell: bash
        run: |
          N=$(( BUILD + 10 ))
          echo "VERSION=1.$N" >> "$GITHUB_ENV"

      - name: Set APP_VERSION + version.txt
        shell: bash
        run: |
          python - "$VERSION" <<'PY'
          import re, sys
          v = sys.argv[1]
          p = "fb_uploader.py"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'APP_VERSION = "[^"]*"', f'APP_VERSION = "{v}"', s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          open("version.txt", "w").write(v + "\n")
          print("set version", v)
          PY

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller playwright ixbrowser-local-api pystray pillow pytesseract yt-dlp

      - name: Get wireproxy (VPN tunnel engine)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R whyvl/wireproxy --pattern "*windows_amd64*" -D wp \
            || gh release download -R pufferffish/wireproxy --pattern "*windows_amd64*" -D wp
          cd wp && for f in *; do case "$f" in *.tar.gz) tar -xzf "$f";; *.zip) unzip -o "$f";; esac; done
          cp "$(find . -iname 'wireproxy*.exe' | head -1)" ../wireproxy.exe && ls -l ../wireproxy.exe

      - name: Build app exe
        run: |
          $extra = @()
          if (Test-Path wireproxy.exe) { $extra = @("--add-binary", "wireproxy.exe;.") }
          pyinstaller --onefile --noconsole --name "Facebook Uploader" --icon app_icon.ico @extra `
            --collect-all playwright `
            --hidden-import ixbrowser_local_api --collect-all ixbrowser_local_api `
            --hidden-import pystray --hidden-import PIL --hidden-import pytesseract `
            --collect-all yt_dlp `
            fb_uploader.py
          copy "dist\Facebook Uploader.exe" "Facebook_Uploader-v${{ env.VERSION }}.exe"

      - name: Build installer exe
        run: |
          copy "dist\Facebook Uploader.exe" "Facebook Uploader.exe"
          pyinstaller --onefile --noconsole --name "Facebook Uploader Setup" --icon app_icon.ico `
            --add-data "Facebook Uploader.exe;." `
            --add-data "app_icon.ico;." `
            installer.py
          copy "dist\Facebook Uploader Setup.exe" "Facebook_Uploader_Setup-v${{ env.VERSION }}.exe"

      - name: Commit version bump
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fb_uploader.py version.txt
          git commit -m "Facebook Uploader v$VERSION [skip ci]" || echo "no changes"
          git push || echo "push skipped"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(git log -1 --pretty=%B)
          gh release create "fbu-v${VERSION}" \
            "Facebook_Uploader-v${VERSION}.exe" \
            "Facebook_Uploader_Setup-v${VERSION}.exe" \
            --title "DK Facebook Uploader ${VERSION}" --latest=false \
            --notes "$NOTES" --target "$GITHUB_SHA"
