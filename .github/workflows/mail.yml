name: Mail app – build and release

# Every change under mail/ builds a signed APK and publishes it as a GitHub Release
# tagged mail-v1.0.<n> and titled "Mail 1.0.<n>". Obtainium filters releases by that title.
on:
  push:
    branches: [main]
    paths:
      - 'mail/**'
      - '.github/workflows/mail.yml'
      - '!mail/**.md'
      - '!mail/web-server/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mail-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mail
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        id: keys
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::Signing secrets are not set yet: building only to check the code, no release. See the repo README > Signing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ steps.keys.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../Mail-v${VERSION_NAME}.apk"

      - name: Publish release
        if: steps.keys.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(git log -1 --pretty=%B)
          gh release create "mail-v${VERSION_NAME}" "../Mail-v${VERSION_NAME}.apk" \
            --title "Mail ${VERSION_NAME}" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA"

      - name: Keep the unsigned test build
        if: steps.keys.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mail-test-build
          path: Mail-v${{ env.VERSION_NAME }}.apk

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
