# TezDM: every push that changes tezdm/ builds the app and publishes it.
#  - Release "tezdm-latest": always the newest build, with fixed file names
#    (the download links in the main README never change)
#  - Release "tezdm-vX.Y.Z": one per version, kept as history
# Tests run first on Windows; a failing test stops the release.
# To ship a new version: change tezdm/VERSION and push.
name: TezDM

on:
  push:
    branches: [main]
    paths:
      - "tezdm/**"
      - ".github/workflows/tezdm.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tezdm-release
  cancel-in-progress: false

jobs:
  # Download-integrity tests on a real Windows machine; no release if any file comes out corrupted
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tezdm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tezdm/go.mod
          cache: false

      - name: Run tests (Windows)
        env:
          TEZDM_NET_TESTS: "1"
        run: go test -count=1 -v ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tezdm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tezdm/go.mod
          cache: false

      - name: Install build tools
        timeout-minutes: 12
        run: |
          # retry: the package mirror sometimes hangs
          for i in 1 2 3; do
            if timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
               timeout 300 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends nsis gcc-mingw-w64-x86-64 zip; then
              exit 0
            fi
            echo "apt attempt $i failed, retrying..."; sleep 15
          done
          exit 1

      - name: Build exe and installer
        run: ./build.sh

      - name: Prepare files
        id: v
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          (cd extension && zip -qr ../dist/TezDM_Chrome_Extension.zip .)
          cp "dist/TezDM_Setup_$V.exe" dist/TezDM_Setup.exe

      - name: Keep build files (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: TezDM-${{ steps.v.outputs.version }}
          path: |
            tezdm/dist/TezDM_Setup_*.exe
            tezdm/dist/TezDM_Chrome_Extension.zip

      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          NOTES="Version $V - $(git log -1 --pretty=%s)"

          # GitHub's API sometimes answers 502/503 for a moment: retry every call
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "retry $i: $*"; sleep $((i * 10)); done; return 1; }
          # 0 = release exists, 1 = it does not, anything else = could not tell
          has_release() {
            for i in 1 2 3 4 5; do
              if out=$(gh release view "$1" --json tagName 2>&1); then return 0; fi
              if echo "$out" | grep -qi "not found"; then return 1; fi
              echo "retry $i: release view $1 ($out)"; sleep $((i * 10))
            done
            return 2
          }

          # 1) Versioned release (history)
          TAG="tezdm-v$V"
          if has_release "$TAG"; then
            retry gh release upload "$TAG" "dist/TezDM_Setup_$V.exe" dist/TezDM_Chrome_Extension.zip --clobber
          elif [ $? -eq 1 ]; then
            retry gh release create "$TAG" "dist/TezDM_Setup_$V.exe" dist/TezDM_Chrome_Extension.zip \
              --title "TezDM $V" --notes "$NOTES" --latest=false
          else
            exit 1
          fi

          # 2) Moving "latest" release with fixed file names
          git tag -f tezdm-latest
          retry git push -f origin tezdm-latest
          if has_release tezdm-latest; then
            retry gh release edit tezdm-latest --title "TezDM (latest: $V)" --notes "$NOTES" --latest=false
            retry gh release upload tezdm-latest dist/TezDM_Setup.exe dist/TezDM_Chrome_Extension.zip --clobber
          elif [ $? -eq 1 ]; then
            retry gh release create tezdm-latest dist/TezDM_Setup.exe dist/TezDM_Chrome_Extension.zip \
              --title "TezDM (latest: $V)" --notes "$NOTES" --latest=false
          else
            exit 1
          fi
