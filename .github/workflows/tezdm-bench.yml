# Manual benchmark (Actions tab > TezDM benchmark > Run workflow):
# how long yt-dlp takes on Windows to start and to list a YouTube video's qualities,
# packed single exe vs. unpacked folder build.
name: TezDM benchmark

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download yt-dlp builds and Deno
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory bench | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile bench/yt-dlp.exe
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_win.zip -OutFile bench/win.zip
          Expand-Archive bench/win.zip -DestinationPath bench/onedir
          Get-ChildItem bench/onedir | Select-Object -First 5 | Format-Table Name, Length
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile bench/deno.zip
          Expand-Archive bench/deno.zip -DestinationPath bench/deno

      - name: Measure
        shell: pwsh
        run: |
          $one = (Resolve-Path bench/yt-dlp.exe).Path
          $dir = (Get-ChildItem -Recurse bench/onedir -Filter yt-dlp.exe | Select-Object -First 1).FullName
          $deno = (Resolve-Path bench/deno/deno.exe).Path
          $url = "https://www.youtube.com/watch?v=jNQXAC9IVRw"
          foreach ($name in @("single exe", "unpacked folder")) {
            $exe = if ($name -eq "single exe") { $one } else { $dir }
            foreach ($i in 1..3) {
              $t = Measure-Command { & $exe --version | Out-Null }
              "{0,-16} --version run {1}: {2:N2} s" -f $name, $i, $t.TotalSeconds
            }
            foreach ($i in 1..2) {
              $t = Measure-Command { $out = & $exe -J --no-playlist --no-warnings --js-runtimes "deno:$deno" $url 2>&1 | Out-String; $global:last = $out }
              $ok = if ($last -match '"formats"') { "ok" } else { "FAILED: " + ($last.Substring(0, [Math]::Min(200, $last.Length))) }
              "{0,-16} qualities run {1}: {2:N2} s  {3}" -f $name, $i, $t.TotalSeconds, $ok
            }
          }
