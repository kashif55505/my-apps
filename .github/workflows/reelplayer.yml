name: ReelPlayer app – build and release

# Every change under reelplayer/ builds a signed APK and publishes it as a GitHub Release
# tagged reelplayer-v1.<n> and titled "ReelPlayer 1.<n>". Obtainium filters releases by that title.
on:
  push:
    branches: [main]
    paths:
      - 'reelplayer/**'
      - '.github/workflows/reelplayer.yml'
      - '!reelplayer/**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reelplayer-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reelplayer
    env:
      # Earlier test builds used versions up to 1.10, so numbering starts above that.
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          N=$(( BUILD + 10 ))
          echo "VERSION_CODE=$N" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.$N" >> "$GITHUB_ENV"

      - name: Check signing secrets
        id: keys
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::Signing secrets are not set yet: building only to check the code, no release. See the repo README > Signing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ steps.keys.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PbuildNumber=$VERSION_CODE
          cp app/build/outputs/apk/release/app-release.apk "../ReelPlayer-v${VERSION_NAME}.apk"

      - name: Publish release
        if: steps.keys.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(git log -1 --pretty=%B)
          gh release create "reelplayer-v${VERSION_NAME}" "../ReelPlayer-v${VERSION_NAME}.apk" \
            --title "ReelPlayer ${VERSION_NAME}" --latest=false \
            --notes "$NOTES" \
            --target "$GITHUB_SHA"

      - name: Keep the unsigned test build
        if: steps.keys.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ReelPlayer-test-build
          path: ReelPlayer-v${{ env.VERSION_NAME }}.apk

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
