name: ReelPlayer app – build and release

# Every change under reelplayer/ builds a signed APK and publishes it as a GitHub Release
# tagged reelplayer-v1.<n> and titled "ReelPlayer 1.<n>". Obtainium filters releases by that title.
on:
  push:
    branches: [main]
    paths:
      - 'reelplayer/**'
      - '.github/workflows/reelplayer.yml'
      - '!reelplayer/**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reelplayer-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reelplayer
    env:
      # Earlier test builds used versions up to 1.10, so numbering starts above that.
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          N=$(( BUILD + 10 ))
          echo "VERSION_CODE=$N" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.$N" >> "$GITHUB_ENV"

      - name: Signing key
        id: keys
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Uses the KEYSTORE_* secrets if they are set, otherwise the repo's own key in .signing/.
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            cp "$GITHUB_WORKSPACE/.signing/release.jks" "$RUNNER_TEMP/release.jks"
            cat "$GITHUB_WORKSPACE/.signing/key.env" >> "$GITHUB_ENV"
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ steps.keys.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || env.SIGN_PW }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || env.SIGN_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || env.SIGN_PW }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PbuildNumber=$VERSION_CODE
          cp app/build/outputs/apk/release/app-release.apk "../ReelPlayer-v${VERSION_NAME}.apk"

      - name: Small update patches from the last few versions
        if: steps.keys.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ../old ../patches
          for back in 1 2 3 4 5; do
            OLD=$(( VERSION_CODE - back ))
            if gh release download "reelplayer-v1.$OLD" -p "*.apk" -D ../old 2>/dev/null; then
              python3 tools/make_patch.py "../old/ReelPlayer-v1.$OLD.apk" "../ReelPlayer-v${VERSION_NAME}.apk" \
                "../patches/ReelPlayer-from-1.$OLD.patch" || rm -f "../patches/ReelPlayer-from-1.$OLD.patch"
              rm -f ../old/*.apk
            fi
          done
          ls -la ../patches

      - name: Publish release
        if: steps.keys.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          NOTES=$(git log -1 --pretty=%B)
          gh release create "reelplayer-v${VERSION_NAME}" "../ReelPlayer-v${VERSION_NAME}.apk" ../patches/*.patch \
            --title "ReelPlayer ${VERSION_NAME}" --latest=false \
            --notes "$NOTES" \
            --target "$GITHUB_SHA"
          # Fixed link that always gives the newest APK:
          # .../releases/download/reelplayer-latest/ReelPlayer.apk
          cp "../ReelPlayer-v${VERSION_NAME}.apk" ../ReelPlayer.apk
          if ! gh release view reelplayer-latest >/dev/null 2>&1; then
            gh release create reelplayer-latest --title "ReelPlayer (latest download link)" \
              --notes "Always the newest ReelPlayer. Link: https://github.com/${GITHUB_REPOSITORY}/releases/download/reelplayer-latest/ReelPlayer.apk" \
              --latest=false --target "$GITHUB_SHA"
          fi
          gh release upload reelplayer-latest ../ReelPlayer.apk --clobber
          gh release edit reelplayer-latest --title "ReelPlayer (latest: ${VERSION_NAME})"

      - name: Keep the unsigned test build
        if: steps.keys.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ReelPlayer-test-build
          path: ReelPlayer-v${{ env.VERSION_NAME }}.apk

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
