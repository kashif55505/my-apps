<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 360px; margin: 0; font: 13px "Segoe UI", Arial, sans-serif; color: #222; }
  header { background: #1565c0; color: #fff; padding: 10px 12px; font-weight: 600; font-size: 15px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #eee; }
  #status { font-size: 12px; }
  .ok { color: #1a7f37; } .bad { color: #c62828; }
  #list { max-height: 260px; overflow: auto; }
  .item { display: flex; gap: 8px; align-items: center; padding: 6px 12px; border-bottom: 1px solid #f2f2f2; }
  .item .u { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .tag { font-size: 10px; background: #e3f2fd; color: #0d47a1; padding: 1px 5px; border-radius: 3px; text-transform: uppercase; }
  button { background: #1565c0; color: #fff; border: 0; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  button:hover { background: #1976d2; }
  .wide { margin: 10px 12px; width: calc(100% - 24px); padding: 8px; }
  .empty { padding: 10px 12px; color: #777; font-size: 12px; }
  #msg { padding: 0 12px 10px; font-size: 12px; }
</style>
</head>
<body>
  <header>TezDM - Fast Download Manager</header>
  <div class="row"><span>App status</span><span id="status">checking...</span></div>
  <div class="row">
    <label for="intercept">Send Chrome downloads to TezDM</label>
    <input type="checkbox" id="intercept">
  </div>
  <button class="wide" id="open" style="background:#455a64">Open TezDM</button>
  <button class="wide" id="pagevid" style="margin-top:0">&#x2B07; Download video on this page</button>
  <div class="row"><b>Media found on this page</b></div>
  <div id="list"></div>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
